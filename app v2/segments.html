<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChurnIQ — Customer Segments</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="segments.css">
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay hidden" id="loading-overlay">
  <div class="loading-spinner-big"></div>
  <div class="loading-text" id="loading-text">Processing…</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-logo-wrap">
    <div class="sidebar-logo">CI</div>
    <span class="sidebar-app-name">ChurnIQ</span>
  </div>
  <div class="sidebar-section-label">Main</div>
  <a class="nav-item" href="dashboard.html">
    <div class="nav-active-bar"></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span class="nav-label">Dashboard</span>
  </a>
  <a class="nav-item" href="at-risk.html">
    <div class="nav-active-bar"></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span class="nav-label">At-Risk Customers</span>
  </a>
  <a class="nav-item active" href="segments.html">
    <div class="nav-active-bar"></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
    <span class="nav-label">Customer Segments</span>
  </a>
  <div class="sidebar-divider"></div>
  <div class="sidebar-section-label">Tools</div>
  <a class="nav-item" href="predict.html">
    <div class="nav-active-bar"></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
    <span class="nav-label">Predict Customer</span>
  </a>
</nav>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <h1>Customer Segments</h1>
    <div class="topbar-right">
      <div class="data-status">
        <div class="data-status-dot none" id="status-dot"></div>
        <span id="status-text">No data loaded</span>
      </div>
      <button class="btn-import" onclick="openModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Import CSV
      </button>
    </div>
  </div>

  <div class="content">

    <!-- EMPTY STATE -->
    <div id="segments-empty" class="empty-state" style="display:none">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      <h3>No data loaded</h3>
      <p>Import your CSV file to see customer segments.</p>
      <button class="btn-primary" onclick="openModal()">Import CSV</button>
    </div>

    <!-- SEGMENTS GRID -->
    <div class="segments-grid" id="segments-grid" style="display:none"></div>

  </div>
</div>

<!-- IMPORT MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalIfOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <h3>Import Customer Data</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="drop-zone" id="drop-zone"
           onclick="document.getElementById('file-input').click()"
           ondragover="handleDragOver(event)"
           ondragleave="handleDragLeave()"
           ondrop="handleDrop(event)">
        <div class="drop-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </div>
        <div class="drop-text">Click or drag & drop your CSV here</div>
        <div style="font-size:11px;color:var(--text-light);margin-top:8px">Supports Customer_Churn.csv format</div>
      </div>
      <input type="file" id="file-input" accept=".csv" style="display:none" onchange="handleFileSelect(event)">
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="segments.js"></script>
</body>
</html>
